<!DOCTYPE html>
<meta charset="utf-8">
<title>Tile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #2c2723;
    background: #f2eee8;
    background-image:
      radial-gradient(70% 90% at 10% 0%, rgba(210, 121, 90, .12) 0%, transparent 62%),
      radial-gradient(60% 80% at 100% 100%, rgba(120, 130, 160, .10) 0%, transparent 60%);
    display: flex;
    align-items: center;
  }
  .say { flex-shrink: 0; }
  .mark { display: flex; align-items: center; gap: 10px; }
  .mark img { display: block; border-radius: 22%; }
  .mark span { font-weight: 600; color: #6f665f; letter-spacing: -.1px; }
  h1 { font-weight: 600; letter-spacing: -.5px; line-height: 1.16; }
  p { color: #6f665f; }
  /* The hint, and it stays a hint: transcription is what somebody installs
     this for, and the brain is what they find out afterwards. */
  .hint { color: #b0563a; font-weight: 500; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  iframe { border: 0; border-radius: 12px; background: #fff;
           box-shadow: 0 18px 44px rgba(40, 30, 22, .20), 0 2px 6px rgba(40, 30, 22, .10); }

  /* 440x280. No text in the picture at this size - the rings read as a shape
     where a screenshot would read as a smudge. */
  body.small { width: 440px; height: 280px; padding: 28px 30px; gap: 18px; }
  body.small .say { width: 186px; }
  body.small .mark img { width: 26px; height: 26px; }
  body.small .mark span { font-size: 11.5px; }
  body.small h1 { margin-top: 12px; font-size: 21px; }
  body.small p { margin-top: 9px; font-size: 11.5px; line-height: 1.48; }
  body.small .hint { margin-top: 12px; font-size: 11px; }

  /* 1400x560. Room to read the product, so the product is what is shown. */
  body.marquee { width: 1400px; height: 560px; padding: 48px 76px; gap: 40px; }
  body.marquee .say { width: 600px; }
  body.marquee .mark img { width: 46px; height: 46px; }
  body.marquee .mark span { font-size: 19px; }
  body.marquee h1 { margin-top: 26px; font-size: 50px; }
  body.marquee p { margin-top: 18px; font-size: 19px; line-height: 1.5; max-width: 32ch; }
  body.marquee .hint { margin-top: 26px; font-size: 17px; }

  /* A transcript, because transcription is what this is installed for. Drawn
     rather than screenshotted: at 440x280 the real popup is a smudge, and this
     is the same three speakers reading at a size that survives the scale. */
  .tx { width: 178px; background: #fff; border-radius: 9px; padding: 11px 12px;
        box-shadow: 0 10px 26px rgba(40, 30, 22, .16), 0 1px 3px rgba(40, 30, 22, .10); }
  .tx .ln + .ln { margin-top: 9px; }
  .tx .who { font-size: 8.5px; font-weight: 600; color: #2c2723; }
  .tx .at { font-size: 7.5px; color: #a49a90; margin-left: 5px; }
  .tx .said { margin-top: 2px; font-size: 8px; line-height: 1.42; color: #6f665f; }
</style>
<div class="say">
  <div class="mark"><img src="../icons/icon128.png" alt=""><span>Notula for Google Meet</span></div>
  <h1></h1>
  <p></p>
  <div class="hint"></div>
</div>
<div class="stage"></div>
<script>
  const shot = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.body.className = shot.kind;
  document.querySelector('h1').textContent = shot.title;
  document.querySelector('p').textContent = shot.sub;
  document.querySelector('.hint').textContent = shot.hint;

  const stage = document.querySelector('.stage');
  if (shot.src) {
    const frame = document.createElement('iframe');
    frame.style.width = shot.w + 'px';
    frame.style.height = shot.h + 'px';
    frame.src = shot.src;
    stage.appendChild(frame);
  } else {
    stage.innerHTML = `<div class="tx">${shot.lines.map((l) => `
      <div class="ln">
        <span class="who">${l[0]}</span><span class="at">${l[1]}</span>
        <div class="said">${l[2]}</div>
      </div>`).join('')}</div>`;
  }
</script>
