<!DOCTYPE html>
<meta charset="utf-8">
<title>Frame</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 800px; height: 500px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #2c2723;
    background: #f2eee8;
    background-image: radial-gradient(70% 90% at 12% 0%, rgba(210, 121, 90, .10) 0%, transparent 62%), radial-gradient(60% 80% at 100% 100%, rgba(120, 130, 160, .10) 0%, transparent 60%);
    padding: 30px 44px;
    display: flex;
  }
  body.side { flex-direction: row; align-items: center; gap: 40px; }
  body.wide { flex-direction: column; gap: 18px; }
  .say { flex-shrink: 0; }
  body.side .say { width: 296px; }
  body.wide .say { max-width: 640px; }
  h1 { font-size: 27px; line-height: 1.22; font-weight: 600; letter-spacing: -.4px; }
  p { margin-top: 12px; font-size: 14.5px; line-height: 1.5; color: #6f665f; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  iframe { border: 0; border-radius: 12px; box-shadow: 0 18px 44px rgba(40, 30, 22, .20), 0 2px 6px rgba(40, 30, 22, .10); background: #fff; }
  iframe.plain { box-shadow: none; border-radius: 0; background: transparent; }
</style>
<div class="say"><h1></h1><p></p></div>
<div class="stage"><iframe></iframe></div>
<script>
  const shot = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  document.body.className = shot.layout || 'side';
  document.querySelector('h1').textContent = shot.title;
  const sub = document.querySelector('p');
  sub.textContent = shot.sub || '';
  sub.hidden = !shot.sub;
  const frame = document.querySelector('iframe');
  frame.style.width = shot.w + 'px';
  frame.style.height = shot.h + 'px';
  if (shot.plain) frame.className = 'plain';
  frame.src = shot.src;
</script>
