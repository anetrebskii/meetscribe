<!DOCTYPE html>
<meta charset="utf-8">
<title>Call</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #17181b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; height: 100%; }
  .tile { position: relative; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .tile.a { background: radial-gradient(120% 120% at 30% 20%, #33404f 0%, #232a33 60%, #1b2027 100%); }
  .tile.b { background: radial-gradient(120% 120% at 70% 25%, #43393a 0%, #2e2726 60%, #221d1d 100%); }
  .tile.c { background: radial-gradient(120% 120% at 40% 80%, #2f4038 0%, #232d28 60%, #1a211d 100%); }
  .tile.d { background: radial-gradient(120% 120% at 60% 30%, #3b3547 0%, #2a2632 60%, #1f1c25 100%); }
  .face { width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 500; letter-spacing: .5px; color: rgba(255,255,255,.86); background: rgba(255,255,255,.13); }
  .who { position: absolute; left: 10px; top: 10px; font-size: 11px; color: rgba(255,255,255,.78); background: rgba(0,0,0,.36); padding: 3px 8px; border-radius: 5px; }
  .caption { position: absolute; left: 22px; bottom: 18px; max-width: 300px; padding: 9px 14px; border-radius: 8px; background: rgba(0,0,0,.62); color: #f1f1f1; font-size: 12.5px; line-height: 1.45; }
  .caption b { display: block; font-size: 10.5px; font-weight: 500; color: rgba(255,255,255,.6); margin-bottom: 2px; }
</style>
<div class="grid">
  <div class="tile a"><div class="face">SC</div><div class="who">Sarah Chen</div></div>
  <div class="tile b"><div class="face">MR</div><div class="who">Marcus Reid</div></div>
  <div class="tile c"><div class="face">PS</div><div class="who">Priya Sharma</div></div>
  <div class="tile d"><div class="face">LV</div><div class="who">Lena Volkov</div></div>
</div>
<div class="caption"><b>Priya Sharma</b>We should rebuild the backend queries at minimum. The UI can stay for now.</div>
<script src="../dist/floating-popup.js"></script>
