<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    [hidden] { display: none !important; }

    /* Notula's palette, the same table the panel carries, so the two
       surfaces of one extension cannot drift apart. */
    :root {
      --bg: #fdfdfb;
      --bg-sunken: #f6f5f1;
      --bg-raised: #fffffd;
      --bg-hover: rgba(28, 28, 26, 0.05);
      --bg-active: rgba(176, 86, 58, 0.12);
      --border: #e2e0d8;
      --border-strong: #cfccc0;
      --text: #1c1c1a;
      --text-dim: #6f6d65;
      --text-faint: #8b8981;
      --accent: #b0563a;
      --accent-text: #fff;
      --warning-bg: #f6ecd8;
      --warning-border: #e0cb96;
      --warning-text: #6b5312;
      --danger: #a83a2a;
      --comment: rgba(176, 86, 58, 0.18);
      --comment-strong: rgba(176, 86, 58, 0.38);
      --shadow: 0 1px 2px rgba(28, 28, 26, 0.05), 0 8px 24px -14px rgba(28, 28, 26, 0.28);
      --font-ui: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      --font-code: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --radius: 6px;
      --quick: 120ms;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-sunken: #171715;
        --bg-raised: #22221f;
        --bg-hover: rgba(242, 241, 236, 0.06);
        --bg-active: rgba(210, 121, 90, 0.18);
        --border: #383833;
        --border-strong: #4c4c45;
        --text: #f2f1ec;
        --text-dim: #a3a199;
        --text-faint: #7d7b73;
        --accent: #d2795a;
        --accent-text: #1c1c1a;
        --warning-bg: #3a3222;
        --warning-border: #5c4f2e;
        --warning-text: #e3cb96;
        --danger: #e08476;
        --comment: rgba(210, 121, 90, 0.2);
        --comment-strong: rgba(210, 121, 90, 0.42);
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
      }
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 340px;
      min-height: 300px;
      max-height: 560px;
      overflow: hidden;
      font-family: var(--font-ui);
      font-size: 12px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg-raised);
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .btn-back {
      padding: 2px 4px;
      font-size: 12px;
      color: var(--text-dim);
      border-radius: 4px;
      transition: color var(--quick) var(--ease), background-color var(--quick) var(--ease);
    }

    .btn-back:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .header-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      font-size: 13px;
      color: var(--text-dim);
      border-radius: 5px;
      transition: background-color var(--quick) var(--ease), color var(--quick) var(--ease);
    }

    .btn-icon:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    /* The connection line under the header. An offer is a button; a wait is
       a band with nothing to press, because there is nothing to do. */
    .connect {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 12px;
      font-size: 11px;
      text-align: start;
      color: var(--accent);
      background: var(--bg-sunken);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      transition: background-color var(--quick) var(--ease);
    }

    .connect:hover { background: var(--bg-hover); }
    .connect:disabled { opacity: 0.6; cursor: default; }

    .connect.warning,
    .connect.warning:hover {
      color: var(--warning-text);
      background: var(--warning-bg);
      border-bottom-color: var(--warning-border);
      cursor: default;
    }

    .connect svg {
      flex: none;
      width: 12px;
      height: 12px;
    }

    /* The one setting: where new meetings go. */
    .default-line {
      padding: 4px 12px;
      background: var(--bg-sunken);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .default-line .where {
      margin-top: 0;
    }

    .default-line .where .dest {
      background: var(--bg-raised);
    }

    .content {
      flex: 1;
      padding: 6px;
      overflow-y: auto;
    }

    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    /* Meeting list items */
    .meeting-item {
      margin-bottom: 2px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color var(--quick) var(--ease);
    }

    .meeting-item:hover { background: var(--bg-hover); }
    .meeting-item.current { background: var(--bg-active); }

    .meeting-item-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .meeting-item-title {
      flex: 1;
      min-width: 0;
      padding: 1px 3px;
      margin: -1px -3px;
      overflow: hidden;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      text-overflow: ellipsis;
      border-radius: 3px;
      outline: none;
    }

    .meeting-item-title[contenteditable="true"] {
      white-space: normal;
      background: var(--bg-sunken);
      outline: 1px solid var(--accent);
    }

    .live-badge {
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      overflow: hidden;
      font-size: 0;
      color: transparent;
      background: var(--accent);
      border-radius: 50%;
    }

    .meeting-item-actions {
      display: flex;
      flex-shrink: 0;
      gap: 2px;
      margin-left: auto;
      opacity: 0;
      transition: opacity var(--quick) var(--ease);
    }

    .meeting-item:hover .meeting-item-actions,
    .meeting-item:focus-within .meeting-item-actions { opacity: 1; }

    .meeting-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      font-size: 12px;
      color: var(--text-dim);
      border-radius: 5px;
      transition: background-color var(--quick) var(--ease), color var(--quick) var(--ease);
    }

    .meeting-action:hover { color: var(--text); background: var(--bg-hover); }
    .meeting-action[data-action="delete"]:hover { color: var(--danger); }

    .meeting-item-meta {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-faint);
    }

    .meeting-item-participants {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .participant-tag {
      /* A name Meet got wrong can be a whole sentence, and one that cannot
         shrink widens the card and puts a scrollbar under the whole list. */
      max-width: 100%;
      overflow: hidden;
      padding: 1px 6px;
      font-size: 10px;
      color: var(--text-dim);
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .delete-confirm {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--danger);
    }

    .confirm-yes, .confirm-no {
      padding: 2px 8px;
      font-size: 11px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 5px;
      transition: background-color var(--quick) var(--ease), color var(--quick) var(--ease);
    }

    .confirm-yes:hover { color: var(--danger); background: var(--bg-hover); }
    .confirm-no:hover { color: var(--text); background: var(--bg-hover); }

    /* Where a meeting went, or why it did not, under its name. The
       destination is the one thing on the line that is pressed. */
    .where {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
      min-width: 0;
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .where svg {
      flex: none;
      width: 12px;
      height: 12px;
      color: var(--text-faint);
    }

    .where .what {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .where.with-dest .what { flex: none; }

    .where.warning { color: var(--warning-text); }
    .where.danger { color: var(--danger); }

    .where .dest {
      display: inline-flex;
      flex: 0 1 auto;
      align-items: center;
      gap: 4px;
      min-width: 48px;
      padding: 1px 6px;
      overflow: hidden;
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      border-radius: 5px;
      transition: background-color var(--quick) var(--ease), border-color var(--quick) var(--ease);
    }

    /* The repository gives way first: it is recognisable from its first letters,
       and the folder is what tells two meetings apart. */
    .where .dest .repo {
      flex: 1 1 0;
      min-width: 2ch;
      max-width: max-content;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-dim);
    }

    .where .dest .sep {
      flex: none;
      color: var(--text-faint);
    }

    .where .dest .folder {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .where .dest:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    /* Nowhere chosen yet: a chip with nothing in it, drawn as the gap it is. */
    .where .dest.empty {
      font-family: var(--font-ui);
      color: var(--text-dim);
      border-style: dashed;
    }

    .where .acts {
      display: flex;
      flex-shrink: 0;
      gap: 2px;
      margin-left: auto;
    }

    .where .acts button {
      padding: 2px 6px;
      font-size: 11px;
      color: var(--accent);
      border-radius: 5px;
      transition: background-color var(--quick) var(--ease);
    }

    .where .acts button:hover { background: var(--bg-hover); }

    /* A screen says one thing and offers one way out. */
    .screen {
      padding: 20px 16px;
    }

    .screen.centre { text-align: center; }

    .screen h3 {
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .screen p {
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    .screen .why {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .screen .why:hover {
      border-bottom-color: currentColor;
    }

    .screen .actions,
    .offer .actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 14px;
    }

    .screen .code {
      display: block;
      margin: 8px 0 12px;
      font-family: var(--font-code);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--text);
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
      padding-left: 0;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-dim);
      list-style: none;
      counter-reset: step;
    }

    .steps li {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .steps li::before {
      content: counter(step);
      counter-increment: step;
      display: inline-grid;
      flex: none;
      place-items: center;
      width: 16px;
      height: 16px;
      font-size: 10px;
      color: var(--text-dim);
      border: 1px solid var(--border-strong);
      border-radius: 50%;
    }

    .primary {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent-text);
      background: var(--accent);
      border-radius: var(--radius);
      transition: opacity var(--quick) var(--ease);
    }

    .primary:hover { opacity: 0.92; }

    .ghost {
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: background-color var(--quick) var(--ease), color var(--quick) var(--ease);
    }

    .ghost:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    /* The two cards that show once: the rename, and the backlog after the first pairing. */
    .offer {
      margin: 8px 8px 0;
      padding: 8px 10px;
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .offer .head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .offer .what {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .offer .dismiss {
      display: grid;
      flex: none;
      place-items: center;
      width: 20px;
      height: 20px;
      margin: -2px -4px 0 0;
      font-size: 14px;
      color: var(--text-faint);
      border-radius: 4px;
    }

    .offer .dismiss:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .offer p {
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    .offer .actions { margin-top: 8px; }

    /* The surface a picker is drawn on. */
    .menu {
      position: absolute;
      z-index: 1001;
      min-width: 190px;
      max-height: 240px;
      padding: 4px;
      overflow-y: auto;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .menu::-webkit-scrollbar { width: 4px; }
    .menu::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    .menu .item {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 5px 8px;
      font-family: var(--font-code);
      font-size: 11px;
      color: var(--text);
      text-align: start;
      border-radius: 4px;
    }

    .menu .item svg {
      flex: none;
      width: 12px;
      height: 12px;
      color: var(--text-faint);
    }

    .menu .item:hover { background: var(--bg-hover); }

    .menu .item.on {
      color: var(--accent);
      background: var(--bg-active);
    }

    .menu .item.plain {
      font-family: var(--font-ui);
      color: var(--text-dim);
    }

    /* The destination picker: the repository across the top, its folders as a
       tree under it, and a field that filters them or names a new one. */
    .menu.picker {
      display: flex;
      flex-direction: column;
      left: 8px;
      right: 8px;
      min-width: 0;
      padding: 0;
      overflow: hidden;
    }

    .picker .head {
      display: flex;
      flex: none;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      text-align: start;
      border-bottom: 1px solid var(--border);
      transition: background-color var(--quick) var(--ease);
    }

    .picker .head:hover {
      background: var(--bg-hover);
    }

    .picker .head svg {
      flex: none;
      width: 12px;
      height: 12px;
      color: var(--text-faint);
    }

    .picker .head svg:last-child {
      transform: rotate(90deg);
      transition: transform var(--quick) var(--ease);
    }

    .picker .head.open svg:last-child {
      transform: rotate(-90deg);
    }

    .picker .name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .picker .filter {
      flex: none;
      margin: 6px 6px 2px;
      padding: 4px 8px;
      font: inherit;
      font-size: 11px;
      color: var(--text);
      background: var(--bg-sunken);
      border: 1px solid var(--border);
      border-radius: 5px;
      outline: none;
      transition: border-color var(--quick) var(--ease);
    }

    .picker .filter:focus {
      border-color: var(--border-strong);
    }

    .picker .filter::placeholder {
      color: var(--text-faint);
    }

    .picker .body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 4px;
      overflow-y: auto;
    }

    .picker .row {
      padding-left: calc(6px + var(--depth, 0) * 14px);
    }

    .picker .row.cursor {
      background: var(--bg-hover);
    }

    .picker .row.on.cursor {
      background: var(--bg-active);
    }

    .picker .chev {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      margin: -3px -4px -3px -5px;
      color: var(--text-faint);
      border-radius: 3px;
    }

    .picker .chev svg {
      width: 10px;
      height: 10px;
      transition: transform var(--quick) var(--ease);
    }

    .picker .chev.open svg {
      transform: rotate(90deg);
    }

    .picker .chev.none {
      visibility: hidden;
    }

    .picker .chev:hover {
      color: var(--text);
      background: var(--bg-active);
    }

    .picker .tag {
      flex: none;
      padding: 0 4px;
      font-family: var(--font-ui);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-faint);
      border: 1px solid var(--border);
      border-radius: 3px;
    }

    .picker .create .name {
      font-family: var(--font-ui);
      color: var(--text-dim);
    }

    .picker .create b {
      font-family: var(--font-code);
      font-weight: 400;
      color: var(--text);
    }

    .picker .foot {
      flex: none;
      padding: 6px 10px;
      white-space: normal;
      border-top: 1px solid var(--border);
      border-radius: 0;
    }

    .menu .rule {
      height: 1px;
      margin: 4px 0;
      background: var(--border);
    }

    /* Detail view */
    .detail-notes {
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .detail-notes-title {
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .note-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 4px;
      padding: 4px 6px 4px 8px;
      background: var(--comment);
      border-left: 2px solid var(--comment-strong);
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .note-time {
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--text-faint);
    }

    .note-text {
      flex: 1;
      line-height: 1.4;
      color: var(--text);
      word-break: break-word;
    }

    .detail-entries .entry {
      margin-bottom: 4px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-entries .entry:last-child { border-bottom: none; }
    .speaker { margin-right: 6px; font-size: 10px; font-weight: 600; color: var(--text-dim); }
    .time { font-size: 10px; font-variant-numeric: tabular-nums; color: var(--text-faint); }
    .text { margin-top: 2px; line-height: 1.5; color: var(--text); word-break: break-word; }

    .footer {
      display: flex;
      justify-content: space-between;
      min-height: 28px;
      padding: 5px 12px;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--bg-sunken);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .empty-state, .loading {
      padding: 40px 0;
      font-size: 12px;
      text-align: center;
      color: var(--text-faint);
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="btn-back" id="btn-back" style="display:none" title="Back">&larr;</button>
    <span class="header-title" id="header-title">Notula for Google Meet</span>
    <div class="header-actions" id="header-actions" style="display:none">
      <button class="btn-icon" id="detail-copy" title="Copy as Markdown">&#x2398;</button>
      <button class="btn-icon" id="detail-export" title="Download .md">&#x2193;</button>
    </div>
  </div>
